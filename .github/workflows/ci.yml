name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml (channel + rustfmt/clippy). dtolnay/rust-toolchain@master
      # requires a `toolchain` input and would duplicate the pin if we supplied one.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: ./ci.sh
