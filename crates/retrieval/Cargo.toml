[package]
name = "retrieval"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = ["engine"]
# BM25/dense search engine. Disabled by thin clients that only need wire types.
engine = ["dep:half", "dep:inference", "dep:storage", "dep:tantivy"]
cuda = ["engine", "inference/cuda"]

[dependencies]
half = { workspace = true, optional = true }
inference = { path = "../inference", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
storage = { path = "../storage", optional = true }
tantivy = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "bench_dense"
required-features = ["cuda"]

[[example]]
name = "search"
required-features = ["engine"]

[[example]]
name = "bench_search"
required-features = ["engine"]
