[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
publish = false

[features]
default = []
cuda = ["inference/cuda"]

[dependencies]
storage = { path = "../storage" }
indexing = { path = "../indexing" }
retrieval = { path = "../retrieval" }
inference = { path = "../inference" }
tokio = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
