[package]
name = "sift-mcp"
version = "0.1.0"
edition.workspace = true
publish = false

[workspace]
members = [
  "crates/mcp-client",
  "crates/daemon",
  "crates/indexing",
  "crates/retrieval",
  "crates/inference",
  "crates/storage",
  "crates/change-intel",
  "crates/eval",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
ort = "2.0.0-rc.13"
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
half = "2"
blake3 = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
ignore = "0.4"
globset = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"
