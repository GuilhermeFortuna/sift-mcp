[package]
name = "sift-mcp"
version = "0.1.0"
edition.workspace = true
publish = false

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = [
  "crates/mcp-client",
  "crates/daemon",
  "crates/indexing",
  "crates/retrieval",
  "crates/inference",
  "crates/storage",
  "crates/change-intel",
  "crates/eval",
  "crates/console",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
ort = "=2.0.0-rc.12"
cudarc = { version = "0.19.9", default-features = false, features = ["std", "cublas", "driver", "f16", "fallback-dynamic-loading", "cuda-12000"] }
rusqlite = { version = "0.32", features = ["bundled"] }
memmap2 = "0.9"
half = "2"
blake3 = "1"
thiserror = "2"
proptest = "1"
tempfile = "3"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
ignore = "0.4"
globset = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
similar = "2"
insta = "1"
tokenizers = "0.21"
sha2 = "0.10"
gix = "0.70"
rayon = "1"
crossbeam-channel = "0.5"
tantivy = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "process"] }
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs4 = "0.13"
futures = "0.3"
parking_lot = "0.12"
rmcp = { version = "3.2", features = ["server", "macros", "transport-io", "schemars", "client"] }
toml = "0.8"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
tokio-stream = "0.1"
http = "1"
